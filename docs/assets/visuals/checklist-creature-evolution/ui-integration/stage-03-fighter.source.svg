<svg xmlns="http://www.w3.org/2000/svg" width="443" height="980" viewBox="0 0 443 980" role="img" aria-labelledby="title desc">
  <title id="title">履契拳师直接履约分支怪兽页</title><desc id="desc">履契拳师页面聚焦当前兑现任务、按时间排列的真实行动完成证据、持续成长信息与不增加经验的互动入口。</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#171C26" flood-opacity="0.20"/></filter><style>.zh{font-family:"Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",sans-serif;letter-spacing:0}.ink{fill:#171C26}.stone{fill:#6B665D}.cream{fill:#FFF9ED}.lime{fill:#C9F266}.cyan{fill:#54D6C8}.coral{fill:#FF715B}.line{stroke:#D6C8AC;stroke-width:1}.round{stroke-linecap:round;stroke-linejoin:round}</style></defs>
  <rect width="443" height="980" fill="#F4EAD4"/><text x="20" y="17" class="zh ink" font-size="11" font-weight="700">9:41</text>
  <text x="20" y="40" class="zh stone" font-size="13" font-weight="600">怪兽 / 契响卷灵</text><rect x="315" y="31" width="7" height="7" rx="1" class="coral"/><text x="330" y="40" class="zh stone" font-size="13" font-weight="600">直接履约分支</text>
  <text x="20" y="75" class="zh ink" font-size="28" font-weight="800">履契拳师</text><text x="20" y="101" class="zh stone" font-size="14">完全体 · 把承诺变成连续完成的节奏</text>
  <g filter="url(#shadow)"><rect x="20" y="116" width="403" height="320" rx="22" fill="#171C26"/><rect x="20.5" y="116.5" width="402" height="319" rx="21.5" fill="none" stroke="#2B303B"/></g>
  <text x="38" y="145" class="zh cream" font-size="15" font-weight="700">直接履约</text><text x="405" y="145" text-anchor="end" class="zh lime" font-size="13" font-weight="700">完成证据正在累积</text>
