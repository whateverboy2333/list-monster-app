  <rect x="38" y="348" width="367" height="66" rx="10" fill="#2B303B" stroke="#414856"/>
  <rect x="52" y="363" width="25" height="25" rx="5" fill="none" stroke="#FF715B" stroke-width="2"/><text x="89" y="369" class="zh cream" font-size="13" font-weight="600">当前兑现任务</text><text x="89" y="395" class="zh coral" font-size="16" font-weight="800">提交本周项目周报</text><text x="392" y="395" text-anchor="end" class="zh cream" font-size="13">完成后记入证据</text>

