  <rect x="0" y="846" width="443" height="50" fill="#FFF9ED"/><text x="20" y="868" class="zh ink" font-size="14" font-weight="700">兑现不等于催促</text><text x="20" y="889" class="zh stone" font-size="13">没完成的事留在清单里，不评价你，也不扣除成长。</text>
