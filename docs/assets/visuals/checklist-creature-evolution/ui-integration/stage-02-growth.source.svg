  <rect x="230" y="630" width="193" height="92" rx="10" fill="#FFF9ED"/><rect x="246" y="643" width="10" height="10" rx="2" fill="#54D6C8"/><text x="264" y="653" class="zh ink" font-size="13" font-weight="800">复盘完成</text><text x="246" y="679" class="zh ink" font-size="15" font-weight="700">回顾发布记录</text><text x="246" y="704" class="zh stone" font-size="13">昨天 20:10 · 真实完成</text>
  <rect x="20" y="750" width="403" height="48" rx="10" fill="#171C26"/><text x="221.5" y="780" text-anchor="middle" class="zh cream" font-size="16" font-weight="800">回应联页契灵</text>
