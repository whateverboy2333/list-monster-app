  <rect x="20" y="508" width="193" height="66" rx="10" fill="#FFF9ED" stroke="#FF715B"/><rect x="34" y="525" width="16" height="16" rx="3" fill="#FF715B"/><text x="60" y="538" class="zh ink" font-size="14" font-weight="700">持续完成行动任务</text><text x="60" y="559" class="zh stone" font-size="13">只认实际完成证据</text>
