<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">契响卷灵五阶段界面总览</title>
  <desc id="desc">从初诺契茧到诺卷仔、联页契灵，再分支到履契拳师与万策卷贤的五形态总览，比较角色、阶段任务和业务边界。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#171C26" flood-opacity="0.18"/></filter>
    <style>.zh{font-family:"Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",sans-serif;letter-spacing:0}.ink{fill:#171C26}.stone{fill:#6B665D}.cream{fill:#FFF9ED}.lime{fill:#C9F266}.cyan{fill:#54D6C8}.coral{fill:#FF715B}.round{stroke-linecap:round;stroke-linejoin:round}</style>
  </defs>
  <rect width="1600" height="900" fill="#F4EAD4"/>
  <text x="64" y="66" class="zh stone" font-size="18" font-weight="700">清单怪兽 / 掌上回响站</text>
  <text x="64" y="112" class="zh ink" font-size="38" font-weight="800">契响卷灵五阶段总览</text>
  <text x="1536" y="108" text-anchor="end" class="zh stone" font-size="17">共同路径进入等权双分支 · 只由真实任务完成推动成长</text>

  <rect x="40" y="142" width="1520" height="588" rx="24" fill="#171C26" filter="url(#shadow)"/>
  <text x="70" y="177" class="zh cream" font-size="16" font-weight="700">共同成长路径</text>
  <text x="1530" y="177" text-anchor="end" class="zh lime" font-size="15" font-weight="700">角色与界面任务同时变化，不是换标题模板</text>

  <path d="M309 402h52M349 390l12 12-12 12M588 402h52M628 390l12 12-12 12" fill="none" stroke="#C9F266" stroke-width="5" class="round"/>
  <path d="M868 402h56c32 0 32-126 64-126h42M924 402c32 0 32 126 64 126h42" fill="none" stroke="#C9F266" stroke-width="5" class="round"/>
  <rect x="916" y="394" width="16" height="16" rx="3" fill="#C9F266"/>

  <g>
    <rect x="70" y="205" width="239" height="445" rx="16" fill="#2B303B" stroke="#414856"/>
    <text x="90" y="236" class="zh lime" font-size="14" font-weight="800">STAGE 00 · 孵化前</text>
    <image href="role-crops/role-stage-00-egg.png" x="116" y="257" width="146" height="219" preserveAspectRatio="xMidYMid meet" style="image-rendering:pixelated"/>
    <text x="90" y="513" class="zh cream" font-size="24" font-weight="800">初诺契茧</text>
    <text x="90" y="543" class="zh lime" font-size="15" font-weight="700">三项承诺 · 回响 2/3</text>
    <text x="90" y="579" class="zh cream" font-size="14">界面任务：看懂下一次点亮</text>
    <text x="90" y="606" class="zh cream" font-size="14">专属结构：孵化三状态轨</text>
  </g>
  <g>
    <rect x="361" y="205" width="227" height="445" rx="16" fill="#2B303B" stroke="#414856"/>
    <text x="381" y="236" class="zh lime" font-size="14" font-weight="800">STAGE 01 · 幼年体</text>
    <image href="role-crops/role-stage-01-juvenile.png" x="408" y="270" width="134" height="174" preserveAspectRatio="xMidYMid meet" style="image-rendering:pixelated"/>
    <text x="381" y="513" class="zh cream" font-size="24" font-weight="800">诺卷仔</text>
    <text x="381" y="543" class="zh lime" font-size="15" font-weight="700">简单行动反馈 · 初期陪伴</text>
    <text x="381" y="579" class="zh cream" font-size="14">界面任务：陪一件小事完成</text>
    <text x="381" y="606" class="zh cream" font-size="14">专属结构：双条件成长进度</text>
  </g>
  <g>
    <rect x="640" y="205" width="228" height="445" rx="16" fill="#2B303B" stroke="#414856"/>
    <text x="660" y="236" class="zh lime" font-size="14" font-weight="800">STAGE 02 · 共同成长体</text>
    <image href="role-crops/role-stage-02-growth.png" x="664" y="260" width="180" height="176" preserveAspectRatio="xMidYMid meet" style="image-rendering:pixelated"/>
    <text x="660" y="513" class="zh cream" font-size="24" font-weight="800">联页契灵</text>
    <text x="660" y="543" class="zh lime" font-size="15" font-weight="700">双向续页 · 两路等权</text>
    <text x="660" y="579" class="zh cream" font-size="14">界面任务：不强迫提前选边</text>
    <text x="660" y="606" class="zh cream" font-size="14">专属结构：行动 / 复盘双路</text>
  </g>

  <g>
    <rect x="1030" y="202" width="500" height="220" rx="16" fill="#2B303B" stroke="#FF715B" stroke-opacity="0.7"/>
    <text x="1054" y="233" class="zh coral" font-size="14" font-weight="800">STAGE 03 · 完全体 / 直接履约分支</text>
    <image href="role-crops/role-stage-03-fighter.png" x="1052" y="252" width="250" height="158" preserveAspectRatio="xMidYMid meet" style="image-rendering:pixelated"/>
    <text x="1320" y="286" class="zh cream" font-size="26" font-weight="800">履契拳师</text>
    <text x="1320" y="320" class="zh coral" font-size="15" font-weight="700">立即履约 · 完成证据</text>
    <text x="1320" y="355" class="zh cream" font-size="14">专属结构：兑现任务 + 时间线</text>
    <text x="1320" y="385" class="zh cream" font-size="14">表达行动节奏，不做战斗界面</text>
  </g>
  <g>
    <rect x="1030" y="444" width="500" height="250" rx="16" fill="#2B303B" stroke="#54D6C8" stroke-opacity="0.7"/>
    <text x="1054" y="475" class="zh cyan" font-size="14" font-weight="800">STAGE 04 · 完全体 / 规划复盘分支</text>
    <image href="role-crops/role-stage-04-scholar.png" x="1052" y="492" width="255" height="185" preserveAspectRatio="xMidYMid meet" style="image-rendering:pixelated"/>
    <text x="1320" y="525" class="zh cream" font-size="26" font-weight="800">万策卷贤</text>
    <text x="1320" y="559" class="zh cyan" font-size="15" font-weight="700">组织规划 · 回顾证据</text>
    <text x="1320" y="594" class="zh cream" font-size="14">专属结构：计划 / 回顾配对</text>
    <text x="1320" y="624" class="zh cream" font-size="14">表达整理沉淀，不做法术界面</text>
  </g>

  <text x="64" y="777" class="zh ink" font-size="18" font-weight="800">所有阶段共同遵守</text>
  <g transform="translate(64 801)"><rect width="452" height="66" rx="10" fill="#FFF9ED"/><rect x="18" y="21" width="24" height="24" rx="5" fill="#C9F266"/><text x="58" y="29" class="zh ink" font-size="15" font-weight="800">真实任务完成</text><text x="58" y="52" class="zh stone" font-size="13">唯一的 XP 与成长推动来源</text></g>
  <g transform="translate(574 801)"><rect width="452" height="66" rx="10" fill="#FFF9ED"/><rect x="18" y="21" width="24" height="24" rx="5" fill="#54D6C8"/><text x="58" y="29" class="zh ink" font-size="15" font-weight="800">宠物互动</text><text x="58" y="52" class="zh stone" font-size="13">只产生陪伴回应，不增加 XP</text></g>
  <g transform="translate(1084 801)"><rect width="452" height="66" rx="10" fill="#FFF9ED"/><rect x="18" y="21" width="24" height="24" rx="5" fill="#FF715B"/><text x="58" y="29" class="zh ink" font-size="15" font-weight="800">中断或离开</text><text x="58" y="52" class="zh stone" font-size="13">不惩罚、不清空、不羞辱</text></g>
</svg>
