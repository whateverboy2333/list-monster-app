<svg xmlns="http://www.w3.org/2000/svg" width="443" height="980" viewBox="0 0 443 980" role="img" aria-labelledby="title desc">
  <title id="title">清单怪兽掌上回响站，初诺契茧回响积累二比三界面稿 R2</title>
  <desc id="desc">443乘980移动端怪兽页第二次修订稿。主舱仅显示最终蛋资产的透明蛋主体并严格等比呈现，不使用观察窗、光晕、额外阴影或替代装饰；其余信息保持不变。</desc>
  <defs>
    <filter id="stageShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#171C26" flood-opacity="0.20"/>
    </filter>
    <style>
      .zh { font-family: "Microsoft YaHei", "Source Han Sans SC", "Noto Sans CJK SC", sans-serif; letter-spacing: 0; }
      .num { font-family: "Microsoft YaHei", "Source Han Sans SC", sans-serif; font-variant-numeric: tabular-nums; letter-spacing: 0; }
      .ink { fill: #171C26; }
      .stone { fill: #6B665D; }
      .cream { fill: #FFF9ED; }
      .lime { fill: #C9F266; }
      .cyan { fill: #54D6C8; }
      .line { stroke: #D6C8AC; stroke-width: 1; }
      .round { stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="443" height="980" fill="#F4EAD4"/>

